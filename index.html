<!doctype html>
<html lang="ja">
  <head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <meta name="description" content="ボタンひとつで会員番号を発行できます。">
    <title>会員番号の発行</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        color: #17243b;
        background: #f5f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(ellipse at 50% 0%, #e5edff 0, transparent 48%),
          #f5f7fb;
      }

      .page {
        width: min(100%, 480px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 18px 4px;
        color: #42526d;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }

      .brand-mark {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #3d70d6;
        box-shadow: 0 0 0 5px #3d70d61a;
      }

      .card {
        padding: clamp(28px, 7vw, 48px);
        border: 1px solid #e7ebf2;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 20px 60px #253b5b12;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #4774c8;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      h1 {
        margin: 0;
        font-size: clamp(25px, 6vw, 32px);
        letter-spacing: 0.02em;
      }

      .intro {
        margin: 12px 0 30px;
        color: #69758a;
        font-size: 14px;
        line-height: 1.8;
      }

      .number-label {
        display: block;
        margin-bottom: 10px;
        color: #69758a;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .number-box {
        min-height: 82px;
        display: grid;
        place-items: center;
        padding: 16px;
        border: 1px solid #e3eaf5;
        border-radius: 14px;
        background: #f8faff;
      }

      #number {
        color: #213d70;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: clamp(23px, 7vw, 30px);
        font-weight: 700;
        letter-spacing: 0.08em;
        overflow-wrap: anywhere;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 20px;
      }

      button {
        min-height: 50px;
        padding: 12px 16px;
        border: 0;
        border-radius: 12px;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 160ms ease, transform 160ms ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      button:focus-visible {
        outline: 3px solid #8eaff0;
        outline-offset: 3px;
      }

      .primary {
        color: #fff;
        background: #3569cb;
      }

      .primary:hover {
        background: #2859b4;
      }

      .secondary {
        color: #345b9e;
        background: #edf3ff;
      }

      .secondary:hover:not(:disabled) {
        background: #e2ecff;
      }

      button:disabled {
        color: #99a4b6;
        background: #f0f2f6;
        cursor: not-allowed;
      }

      .message {
        min-height: 24px;
        margin: 16px 0 0;
        color: #4774c8;
        font-size: 13px;
        text-align: center;
      }

      .note {
        margin: 22px 0 0;
        color: #8993a3;
        font-size: 11px;
        line-height: 1.7;
        text-align: center;
      }

      @media (max-width: 380px) {
        .actions {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <script src="Untitled-1.js" defer></script>
  </head>
  <body>
    <main class="page">
      <p class="brand"><span class="brand-mark" aria-hidden="true"></span>MEMBER SERVICE</p>
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">MEMBERSHIP</p>
        <h1 id="page-title">会員番号の発行</h1>
        <p class="intro">ボタンを押して、あなたの会員番号を発行してください。</p>

        <span class="number-label">あなたの会員番号</span>
        <div class="number-box">
          <output id="number" aria-live="polite">---</output>
        </div>

        <div class="actions">
          <button class="primary" type="button" onclick="createNumber()">番号を発行する</button>
          <button class="secondary" id="copy-button" type="button" onclick="copyNumber()" disabled>番号をコピー</button>
        </div>
        <p class="message" id="message" role="status" aria-live="polite"></p>
        <p class="note">発行した番号を忘れないようにお控えください。</p>
      </section>
    </main>
  </body>
</html>
